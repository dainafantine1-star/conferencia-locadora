services:
  postgres:
    image: postgres:16-alpine
    container_name: conferencia-postgres
    environment:
      POSTGRES_USER: conferencia
      POSTGRES_PASSWORD: conferencia
      POSTGRES_DB: conferencia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conferencia -d conferencia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
